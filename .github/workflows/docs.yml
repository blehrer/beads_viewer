name: Docs

on:
  push:
    branches: [main]
    # Source-of-truth paths only — exclude generated README.md and screenshot_*.webp
    # so the bot's auto-commit does not enqueue another run.
    paths:
      - 'cmd/bv/**'
      - 'pkg/ui/**'
      - 'pkg/agents/**'
      - 'screenshots/capture.tape'
      - 'screenshots/capture_test.go'
      - 'screenshots/convert_webp.py'
      - 'screenshots/README.md'
      - 'scripts/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: docs-assemble-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  assemble:
    # Defense in depth: path filters exclude generated outputs; these guards catch edge cases.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' &&
        github.actor != 'github-actions[bot]' &&
        !contains(github.event.head_commit.message, 'chore(docs):') &&
        !contains(github.event.head_commit.message, '[skip docs]')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.8'
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-jetbrains-mono

      - name: Install Python dependencies
        run: pip install pillow

      - name: Assemble README and screenshots
        env:
          CGO_CFLAGS: -DSQLITE_ENABLE_FTS5
          BV_SCREENSHOTS_FALLBACK: '0'
        run: make docs

      - name: Commit and push generated docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md screenshots/screenshot_*.webp
          if git diff --staged --quiet; then
            echo "Docs and screenshots already up to date."
            exit 0
          fi
          git commit -m "chore(docs): refresh README docgen and screenshots [skip docs]"
          git pull --rebase origin main
          git push
